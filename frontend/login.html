<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ligature — Log In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 22 22%22><circle cx=%226%22 cy=%226%22 r=%223%22 stroke=%22%232E5C86%22 stroke-width=%221.6%22 fill=%22none%22/><circle cx=%2217%22 cy=%226%22 r=%222.2%22 stroke=%22%238A6D1E%22 stroke-width=%221.6%22 fill=%22none%22/><rect x=%224%22 y=%2214%22 width=%225.4%22 height=%225.4%22 transform=%22rotate(45 6.7 16.7)%22 stroke=%22%23A85433%22 stroke-width=%221.6%22 fill=%22none%22/></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-main">
      <div class="login-shell">
        <div class="brand login-brand">
          <svg width="26" height="26" viewBox="0 0 22 22" fill="none" aria-hidden="true">
            <circle cx="6" cy="6" r="3" stroke="var(--athlete)" stroke-width="1.6" />
            <circle cx="17" cy="6" r="2.2" stroke="var(--flag)" stroke-width="1.6" />
            <rect x="4" y="14" width="5.4" height="5.4" transform="rotate(45 6.7 16.7)" stroke="var(--injury)" stroke-width="1.6" />
            <line x1="8" y1="8" x2="15" y2="7" stroke="var(--border-strong)" stroke-width="1.2" />
            <line x1="6.5" y1="9" x2="6.7" y2="14" stroke="var(--border-strong)" stroke-width="1.2" />
          </svg>
          <h1>Ligature</h1>
        </div>

        <form id="login-form" class="form-card">
          <div class="form-field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="username" required />
          </div>

          <div class="form-field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required />
          </div>

          <div id="login-error" class="login-error hidden"></div>

          <button type="submit" class="form-submit" id="login-submit">Log in</button>
        </form>
      </div>
    </main>

    <script type="module" src="login.js"></script>
  </body>
</html>
