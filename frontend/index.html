<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ligature — Graph Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 22 22%22><circle cx=%226%22 cy=%226%22 r=%223%22 stroke=%22%232E5C86%22 stroke-width=%221.6%22 fill=%22none%22/><circle cx=%2217%22 cy=%226%22 r=%222.2%22 stroke=%22%238A6D1E%22 stroke-width=%221.6%22 fill=%22none%22/><rect x=%224%22 y=%2214%22 width=%225.4%22 height=%225.4%22 transform=%22rotate(45 6.7 16.7)%22 stroke=%22%23A85433%22 stroke-width=%221.6%22 fill=%22none%22/></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="6" cy="6" r="3" stroke="var(--athlete)" stroke-width="1.6" />
          <circle cx="17" cy="6" r="2.2" stroke="var(--flag)" stroke-width="1.6" />
          <rect x="4" y="14" width="5.4" height="5.4" transform="rotate(45 6.7 16.7)" stroke="var(--injury)" stroke-width="1.6" />
          <line x1="8" y1="8" x2="15" y2="7" stroke="var(--border-strong)" stroke-width="1.2" />
          <line x1="6.5" y1="9" x2="6.7" y2="14" stroke="var(--border-strong)" stroke-width="1.2" />
        </svg>
        <h1>Ligature</h1>
      </div>

      <div class="brand-divider"></div>

      <div class="search-box">
        <svg class="field-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4" />
          <line x1="9.2" y1="9.2" x2="12.5" y2="12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <input type="search" id="search-input" placeholder="Search athletes, injuries…" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="ask-box">
        <form id="ask-form">
          <svg class="field-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <path d="M2 8c0-3.3 2.7-6 6-6 2.8 0 5 2 5.6 4.6.4 1.7-.2 3.2-1.6 4.4l.4 2.7-2.6-1.1c-.5.1-1.1.2-1.8.2-3.3 0-6-2.7-6-6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <input type="text" id="ask-input" placeholder="Ask a question about the data — e.g. “who else spiked like Doyle before their hamstring strain?”" autocomplete="off" />
          <button type="submit" class="ask-submit" id="ask-submit">Ask</button>
        </form>
      </div>

      <div class="header-spacer"></div>

      <a class="icon-button" id="import-data-link" href="ingest.html" aria-label="Import data" title="Import data">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 2v8M5 7l3 3 3-3M2.5 12.5v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1" />
        </svg>
      </a>

      <div class="filter-box">
        <button type="button" class="icon-button" id="filter-toggle" aria-label="Filters" title="Filters">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h12M4.5 8h7M7 13h2" />
          </svg>
        </button>
        <div class="filter-panel" id="filter-panel">
          <label class="filter-row">
            <input type="checkbox" id="filter-active-only" checked />
            Only athletes with an injury or flag
          </label>

          <div class="filter-section-title">Node types</div>
          <div class="filter-checks" id="filter-types"></div>

          <div class="filter-section-title">Position</div>
          <div class="filter-checks" id="filter-positions"></div>

          <button type="button" class="filter-reset" id="filter-reset">Reset to defaults</button>
        </div>
      </div>

      <button type="button" class="icon-button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M14 9.5A6 6 0 1 1 6.5 2 4.8 4.8 0 0 0 14 9.5z" stroke-linejoin="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="8" cy="8" r="3.4" />
          <line x1="8" y1="1.5" x2="8" y2="3.2" />
          <line x1="8" y1="12.8" x2="8" y2="14.5" />
          <line x1="1.5" y1="8" x2="3.2" y2="8" />
          <line x1="12.8" y1="8" x2="14.5" y2="8" />
        </svg>
      </button>
    </header>

    <div class="answer-band hidden" id="answer-band"></div>

    <main>
      <div class="graph-pane">
        <svg id="graph-svg"></svg>
        <div class="graph-loading" id="graph-loading">
          <span class="spinner"></span>
          <span id="graph-loading-text">Loading graph…</span>
        </div>
        <div class="graph-hint">drag to pan · scroll to zoom · click a node to expand it</div>

        <div class="legend-panel" id="legend-panel">
          <div class="legend-head" id="legend-toggle">
            <span class="legend-title">Legend</span>
            <svg class="legend-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="legend-items" id="legend-items"></div>
        </div>

        <button type="button" class="legend-pill" id="legend-pill">
          <span>Legend</span>
          <svg width="9" height="9" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="zoom-controls">
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <div class="zoom-divider"></div>
          <button type="button" id="zoom-out" aria-label="Zoom out">–</button>
          <div class="zoom-divider"></div>
          <button type="button" id="zoom-reset" aria-label="Reset view">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.2" />
            </svg>
          </button>
        </div>
      </div>

      <div class="legend-sheet" id="legend-sheet">
        <div class="legend-items" id="legend-items-mobile"></div>
      </div>

      <div class="detail-backdrop" id="detail-backdrop"></div>
      <aside class="detail-panel" id="detail-panel">
        <button type="button" class="detail-close" id="detail-close" aria-label="Close panel">&times;</button>
        <div id="detail-body">
          <p class="empty">Click a node or edge to inspect it.</p>
        </div>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
